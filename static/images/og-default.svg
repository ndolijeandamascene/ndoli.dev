<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Accent -->
  <g stroke="#334155" stroke-width="1" opacity="0.5">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="530" x2="1200" y2="530"/>
  </g>

  <!-- Glowing Accent Orb -->
  <circle cx="960" cy="190" r="190" fill="#22C55E" opacity="0.15" filter="blur(45px)"/>
  <circle cx="1060" cy="300" r="140" fill="#FACC15" opacity="0.12" filter="blur(45px)"/>

  <!-- Brand Pill -->
  <rect x="120" y="130" width="160" height="38" rx="19" fill="rgba(34, 197, 94, 0.15)" stroke="#22C55E" stroke-width="1.5"/>
  <text x="200" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700" fill="#22C55E" text-anchor="middle">NDOLI.DEV</text>

  <!-- Main Headline -->
  <text x="120" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="62" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">
    NDOLI Jean Damascene
  </text>

  <!-- Subtitle -->
  <text x="120" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="25" font-weight="600" fill="url(#accentGrad)">
    IT Operations Administrator · Systems Administrator · Software Developer
  </text>

  <!-- Description -->
  <text x="120" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
    Building practical digital systems, enterprise servers, and intelligent software.
  </text>

  <!-- Capability Badges -->
  <g transform="translate(120, 435)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="180" height="34" rx="8" fill="rgba(34, 197, 94, 0.14)" stroke="#22C55E" stroke-width="1.2"/>
    <text x="90" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#22C55E" text-anchor="middle">Systems &amp; Servers</text>

    <!-- Badge 2 -->
    <rect x="195" y="0" width="180" height="34" rx="8" fill="rgba(250, 204, 21, 0.14)" stroke="#FACC15" stroke-width="1.2"/>
    <text x="285" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#FACC15" text-anchor="middle">Software &amp; Python</text>

    <!-- Badge 3 -->
    <rect x="390" y="0" width="180" height="34" rx="8" fill="rgba(34, 197, 94, 0.14)" stroke="#22C55E" stroke-width="1.2"/>
    <text x="480" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#22C55E" text-anchor="middle">AI &amp; RAG Systems</text>

    <!-- Badge 4 -->
    <rect x="585" y="0" width="200" height="34" rx="8" fill="rgba(250, 204, 21, 0.14)" stroke="#FACC15" stroke-width="1.2"/>
    <text x="685" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#FACC15" text-anchor="middle">Networking &amp; Security</text>
  </g>

  <!-- Footer Tag -->
  <text x="120" y="535" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="18" font-weight="500" fill="#22C55E">
    https://ndoli.dev
  </text>
</svg>
