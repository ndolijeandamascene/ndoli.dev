{% extends 'base.html' %}

{% block title %}500 &mdash; Server Error | {{ OWNER_NAME }}{% endblock %}

{% block content %}
<section class="section" style="padding-top: var(--space-24); padding-bottom: var(--space-24); text-align: center;">
  <div class="container-narrow">
    <span class="badge badge-yellow" style="font-size: var(--text-base); padding: 6px 16px; margin-bottom: var(--space-4);">ERROR 500</span>
    <h1 style="font-size: clamp(2.5rem, 5vw, 4rem); margin-bottom: var(--space-4);">Server Error</h1>
    <p style="font-size: var(--text-lg); color: var(--text-secondary); margin-bottom: var(--space-8); max-width: 500px; margin-left: auto; margin-right: auto;">
      Something unexpected happened on our server. The error has been logged and is being investigated.
    </p>

    <div style="display: flex; justify-content: center; gap: var(--space-4); flex-wrap: wrap;">
      <a href="{% url 'core:home' %}" class="btn btn-primary btn-lg">&larr; Return Home</a>
      <a href="{% url 'core:contact' %}" class="btn btn-secondary btn-lg">Report Issue</a>
    </div>
  </div>
</section>
{% endblock %}
