<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F171B"/>
      <stop offset="100%" stop-color="#070A0C"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-opacity="0.6"/>

  <!-- Subtle Glow Layer -->
  <circle cx="256" cy="256" r="160" fill="#22C55E" fill-opacity="0.06" filter="url(#subtleGlow)"/>

  <!-- Monogram ND -->
  <!-- Letter N -->
  <path d="M128 360 V152 H172 L248 276 V152 H288 V360 H244 L168 236 V360 Z" fill="#F8FAFC"/>
  
  <!-- Letter D with Green & Yellow Accent -->
  <path d="M308 152 H360 C404 152 432 184 432 256 C432 328 404 360 360 360 H308 V152 Z M350 320 C376 320 388 300 388 256 C388 212 376 192 350 192 H348 V320 H350 Z" fill="url(#accentGrad)"/>

  <!-- Brand Dot Accent -->
  <circle cx="432" cy="352" r="16" fill="url(#yellowGrad)"/>
</svg>
